name: Divar Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  divar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run Cars
        run: python d.py

      - name: Run Motorcycles
        run: python m.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          for name in ("divar_cars.json", "divar_motorcycles.json"):
              with open(name, encoding="utf-8") as f:
                  data = json.load(f)
              tokens = [x.get("token") for x in data if x.get("token")]
              if len(tokens) != len(set(tokens)):
                  raise SystemExit(f"Duplicate token detected: {name}")
              print(name, "count=", len(data), "unique=", len(tokens))
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add divar_cars.json divar_motorcycles.json

          git diff --cached --quiet || git commit -m "Update Divar DOM data"
          git push
