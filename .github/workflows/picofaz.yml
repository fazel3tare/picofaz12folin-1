name: D Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/55 * * * *"

permissions:
  contents: write

concurrency:
  group: divar-scraper
  cancel-in-progress: false

jobs:
  divar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install requests
        run: python -m pip install requests

      - name: 75-minute gate
        id: gate
        shell: bash
        run: |
          now=$(date +%s)
          last=0
          if [ -f .divar_last_success.txt ]; then
            last=$(cat .divar_last_success.txt || echo 0)
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((now-last)) -ge 4500 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

          echo "now=$now"
          echo "last=$last"
          echo "elapsed=$((now-last))"

      - name: Run Motorcycles
        if: steps.gate.outputs.run == 'true'
        run: python m.py

      - name: Run Cars
        if: steps.gate.outputs.run == 'true'
        run: python d.py

      - name: Mark successful run
        if: steps.gate.outputs.run == 'true'
        run: date +%s > .divar_last_success.txt

      - name: Commit updated data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add divar_motorcycles.json divar_cars.json .divar_last_success.txt
          git diff --cached --quiet || git commit -m "Update Divar data"
          git push
