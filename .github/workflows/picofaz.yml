name: Divar Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  divar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install requests
        run: python -m pip install requests

      - name: Run Motorcycles
        run: python m.py

      - name: Run Cars
        run: python d.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add divar_motorcycles.json divar_cars.json

          git diff --cached --quiet || git commit -m "Update Divar data"

          git push
